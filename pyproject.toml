[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-shogi-ai-lab"
version = "0.1.0"
description = "Animal Shogi engine, agents, and reinforcement learning lab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jones and Jarvis" }
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "typer>=0.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.4"
]
ui = [
  "pygame>=2.6"
]
rl = [
  "torch>=2.3",
  "gymnasium>=0.29"
]

[project.scripts]
animal-shogi-lab = "animal_shogi_ai_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
